<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Console · XHS Content Agent</title>
  <style>
    :root{--red:#ff2442;--ink:#202124;--muted:#667085;--line:#e4e7ec;--soft:#f6f7f9;--green:#168a45;--amber:#c87500;--dark:#20242a}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--soft);letter-spacing:0}
    button,input,textarea,select{font:inherit}button{cursor:pointer}.app{height:100vh;display:grid;grid-template-columns:76px minmax(330px,.9fr) minmax(440px,1.1fr);grid-template-rows:56px 1fr;overflow:hidden}
    .brand{grid-column:1;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}.topbar{grid-column:2/4;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;min-width:0}.title{display:flex;align-items:center;gap:10px;font-weight:750}.run-id{font-size:12px;color:var(--muted);font-weight:500}.top-actions{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}.status{display:flex;align-items:center;gap:6px;font-weight:650}.status::before{content:"";width:8px;height:8px;border-radius:50%;background:#98a2b3}.status.running::before{background:#f59e0b}.status.completed::before{background:#22a35a}.status.failed::before,.status.stopped::before{background:#d92d20}
    .icon-btn{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:6px;display:grid;place-items:center;font-size:16px}.danger{color:#b42318;border-color:#f6c8c4}.danger:disabled{opacity:.4;cursor:not-allowed}
    .toolbox{grid-row:2;background:var(--dark);padding:10px 7px;display:flex;flex-direction:column;align-items:center;gap:7px;overflow:auto}.tool{width:60px;min-height:50px;border:1px solid transparent;border-radius:6px;background:transparent;color:#b9c0c9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}.tool:hover{background:#2b3037}.tool .glyph{font-size:16px;font-weight:800}.tool small{font-size:10px}.tool .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:#69717c}.tool.running{background:#3c292d;color:#fff;border-color:#8f4652}.tool.running .dot{background:#ffb020}.tool.completed{background:#29362f;color:#a4dfb8}.tool.completed .dot{background:#37c878}.tool.failed{background:#42272a;color:#ffc0c8}.tool.failed .dot{background:#ff4d62}.tool.disabled{opacity:.38}.tool.history{margin-bottom:4px;border-bottom:1px solid #41464e;border-radius:0;padding-bottom:9px}.tool-divider{width:46px;height:1px;background:#41464e;margin:1px 0}
    .conversation{grid-column:2;grid-row:2;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden}.messages{flex:1;overflow:auto;padding:20px}.empty{height:100%;display:flex;flex-direction:column;justify-content:center;max-width:560px;margin:auto}.empty h1{font-size:25px;margin:0 0 8px}.empty p{color:var(--muted);line-height:1.7;margin:0 0 20px}.suggestions{display:grid;gap:8px}.suggestion{border:1px solid var(--line);background:#fff;border-radius:6px;padding:11px 12px;text-align:left;color:#344054}.suggestion:hover{border-color:#ff97a8}
    .speaker{font-size:11px;font-weight:700;color:var(--muted);margin:0 0 5px}.bubble{max-width:94%;padding:11px 13px;border-radius:7px;margin-bottom:15px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.user{margin-left:auto;background:#f0f2f5}.bubble.agent{border:1px solid var(--line);border-left:3px solid var(--red);background:#fff}.decision{margin-top:8px;padding:8px 9px;background:#fff8e8;border:1px solid #f2d290;border-radius:5px;color:#684600}
    .composer{position:relative;border-top:1px solid var(--line);padding:13px;background:#fff}.composer textarea{width:100%;min-height:78px;max-height:160px;resize:vertical;border:1px solid #cbd2da;border-radius:6px;padding:10px 11px;outline:none;line-height:1.5}.composer textarea:focus{border-color:#ff758b;box-shadow:0 0 0 3px rgba(255,36,66,.08)}.settings{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.settings input,.settings select{width:100%;height:36px;border:1px solid var(--line);border-radius:5px;padding:0 9px;background:#fff}.composer-actions{display:flex;align-items:center;justify-content:space-between;margin-top:9px;gap:10px;flex-wrap:wrap}.hint{font-size:11px;color:var(--muted)}.ctx-cluster{display:flex;align-items:center;gap:8px;margin-left:auto}.ctx-wrap[hidden]{display:none}.ctx-chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 8px;border:1px solid var(--line);background:#fff;border-radius:999px;color:var(--ink);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}.ctx-chip[aria-expanded="true"]{border-color:#b9cdf8;background:#f5f8ff}.ctx-ring{width:16px;height:16px;transform:rotate(-90deg)}.ctx-ring circle{fill:none;stroke-width:2.4}.ctx-ring-track{stroke:#e4e7ec}.ctx-ring-value{stroke:#3b82f6;stroke-linecap:round;stroke-dasharray:43.9823;stroke-dashoffset:43.9823;transition:stroke-dashoffset .2s ease}.ctx-popover{position:absolute;right:13px;bottom:calc(100% + 8px);width:min(280px,calc(100% - 26px));max-height:min(420px,70vh);overflow:auto;background:#2c313a;color:#f2f4f7;border-radius:12px;padding:14px 14px 12px;box-shadow:0 12px 40px rgba(16,24,40,.28);z-index:40}.ctx-history{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}.ctx-history button{border:0;background:#3a4150;color:#f2f4f7;border-radius:99px;padding:3px 8px;font:11px/1.4 ui-monospace,Menlo,Consolas,monospace;cursor:pointer}.ctx-history button.on{outline:1px solid #8ab4f8}.ctx-popover[hidden]{display:none}.ctx-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px;font-weight:650;margin-bottom:10px}.ctx-ratio{font-size:12px;font-weight:500;color:#d0d5dd;font-variant-numeric:tabular-nums;white-space:nowrap}.ctx-bar{height:6px;border-radius:99px;background:#4a5160;display:flex;overflow:hidden;margin-bottom:12px}.ctx-bar span{display:block;height:100%}.ctx-row{display:flex;align-items:center;gap:8px;font-size:13px;margin:7px 0}.ctx-row i{width:8px;height:8px;border-radius:2px;flex:0 0 auto}.ctx-row span{flex:1}.ctx-row b{font-weight:600;font-variant-numeric:tabular-nums;color:#f8fafc}.ctx-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:11px;color:#98a2b3}.ctx-foot a{color:#8ab4f8;text-decoration:none;white-space:nowrap}.ctx-empty{font-size:12px;color:#d0d5dd;line-height:1.5}.primary{border:0;border-radius:6px;background:var(--red);color:#fff;font-weight:700;padding:9px 15px}.primary:disabled{opacity:.45;cursor:not-allowed}
    .workbench{grid-column:3;grid-row:2;display:flex;flex-direction:column;min-width:0;overflow:hidden}.tabs{height:44px;flex:0 0 44px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:end;padding:0 17px;gap:23px}.tab{height:44px;border:0;background:none;color:var(--muted);padding:0 2px;border-bottom:2px solid transparent}.tab.active{color:var(--ink);font-weight:700;border-bottom-color:var(--red)}.panel{flex:1;overflow:auto;padding:16px 18px}.panel[hidden]{display:none}.timeline-empty{height:100%;display:grid;place-items:center;color:var(--muted);text-align:center}.event{background:#fff;border:1px solid var(--line);border-radius:6px;margin-bottom:9px;overflow:hidden}.event-head{display:grid;grid-template-columns:18px 1fr auto;gap:8px;padding:10px 11px;align-items:start}.event-node{width:10px;height:10px;border-radius:50%;background:#aeb7c2;margin-top:4px}.event.running .event-node{background:#f59e0b}.event.done .event-node{background:#22a35a}.event.error .event-node{background:#d92d20}.event-title{font-size:13px;font-weight:700}.event-sub{font-size:11px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}.event-time{font-size:10px;color:var(--muted);white-space:nowrap}.event-detail{border-top:1px solid var(--line);padding:9px 11px;background:#fafbfc}.code{background:#1e2329;color:#d7e0ea;border-radius:5px;padding:8px;font:10px/1.5 Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:180px;overflow:auto}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.metric{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px}.metric b{display:block;font-size:18px;margin-bottom:3px}.metric span{font-size:11px;color:var(--muted)}
    .artifact{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:10px}.artifact h3{font-size:14px;margin:0 0 8px}.artifact p{font-size:12px;line-height:1.7;margin:0;color:#344054;white-space:pre-wrap}.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.tag{font-size:10px;background:#f0f2f5;border-radius:10px;padding:3px 7px;color:#475467}
    .drawer{position:fixed;inset:56px auto 0 76px;width:340px;background:#fff;border-right:1px solid var(--line);box-shadow:10px 0 28px rgba(16,24,40,.12);z-index:10;display:flex;flex-direction:column}.drawer[hidden]{display:none}.drawer-head{height:50px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 15px}.drawer-body{padding:10px;overflow:auto}.history-item{width:100%;border:1px solid var(--line);background:#fff;border-radius:6px;padding:10px;text-align:left;margin-bottom:8px}.history-item:hover{border-color:#ff97a8}.history-goal{font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history-meta{font-size:10px;color:var(--muted);margin-top:5px;display:flex;justify-content:space-between}
    dialog{border:0;border-radius:8px;padding:0;width:min(520px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(16,24,40,.24)}dialog::backdrop{background:rgba(17,24,39,.5)}.dialog-head{padding:16px 18px;border-bottom:1px solid var(--line);font-weight:750}.dialog-body{padding:16px 18px}.dialog-actions{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.secondary{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 12px}.approve{border:0;background:var(--red);color:#fff;border-radius:6px;padding:8px 12px;font-weight:700}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#20242a;color:#fff;border-radius:6px;padding:9px 14px;font-size:12px;z-index:30;display:none}
    @media(max-width:980px){.app{height:auto;min-height:100vh;grid-template-columns:66px 1fr;grid-template-rows:54px minmax(560px,calc(100vh - 54px)) 620px;overflow:visible}.brand{grid-column:1}.topbar{grid-column:2}.toolbox{grid-row:2/4}.conversation{grid-column:2;grid-row:2}.workbench{grid-column:2;grid-row:3;border-top:1px solid var(--line)}.drawer{left:66px;top:54px}.top-actions .model{display:none}}
    @media(max-width:620px){.settings{grid-template-columns:1fr}.topbar{padding:0 10px}.run-id{display:none}.metrics{grid-template-columns:1fr}.drawer{width:calc(100vw - 66px)}}
  </style>
</head>
<body>
<main class="app">
  <div class="brand">XHS</div>
  <header class="topbar">
    <div class="title">Agent Console <span class="run-id" id="runId">新任务</span></div>
    <div class="top-actions"><span class="model" id="modelLabel">OpenAI</span><a id="contextUsageLink" href="/static/context_usage.html" target="_blank" title="上下文占用" style="color:inherit;text-decoration:none;font-size:12px">Ctx</a><span class="status" id="runStatus">就绪</span><button class="icon-btn danger" id="stopRunBtn" title="停止任务" disabled>■</button><a class="icon-btn" href="/static/index.html" title="返回首页" style="text-decoration:none;color:inherit">⌂</a></div>
  </header>

  <nav class="toolbox" aria-label="Agent 工具箱">
    <button class="tool history" id="historyBtn" title="历史任务"><span class="glyph">◷</span><small>历史</small></button>
    <div class="tool-divider"></div>
    <button class="tool" data-tool="knowledge_search"><i class="dot"></i><span class="glyph">◈</span><small>检索</small></button>
    <button class="tool" data-tool="crawl_notes"><i class="dot"></i><span class="glyph">⌕</span><small>采集</small><span class="tool-count" id="crawlProgress"></span></button>
    <button class="tool" data-tool="analyze_notes"><i class="dot"></i><span class="glyph">▥</span><small>分析</small></button>
    <button class="tool" data-tool="generate_topics"><i class="dot"></i><span class="glyph">◇</span><small>选题</small></button>
    <button class="tool" data-tool="generate_contents"><i class="dot"></i><span class="glyph">T</span><small>生成</small></button>
    <button class="tool" data-tool="generate_images"><i class="dot"></i><span class="glyph">▧</span><small>配图</small></button>
    <button class="tool disabled" data-tool="publish_to_xhs" title="默认禁用，启用后仍需审批"><i class="dot"></i><span class="glyph">↑</span><small>发布</small></button>
    <button class="tool disabled" data-tool="sync_to_feishu" title="默认禁用，启用后仍需审批"><i class="dot"></i><span class="glyph">F</span><small>飞书</small></button>
  </nav>

  <section class="conversation">
    <div class="messages" id="messages">
      <div class="empty" id="emptyState">
        <h1>给 Agent 一个目标</h1>
        <p>描述结果和约束即可，不必拆解步骤。Agent 会选择工具、执行、反思，并在需要时调整计划。</p>
        <div class="suggestions">
          <button class="suggestion">分析已有样本，找出大学生平价护肤内容机会，生成 3 篇差异化笔记，不要发布。</button>
          <button class="suggestion">围绕城市露营新手，自主分析高互动规律并生成 2 个低竞争选题和对应文案。</button>
        </div>
      </div>
    </div>
    <form class="composer" id="runForm">
      <textarea id="goalInput" required placeholder="例如：分析近 30 天露营内容，生成 3 篇差异化笔记，不要发布。"></textarea>
      <div class="settings"><input id="audienceInput" placeholder="目标受众，例如：城市露营新手"><input id="toneInput" placeholder="内容风格，例如：真实克制"></div>
      <div class="composer-actions"><span class="hint">默认禁用真实发布与飞书同步</span><div class="ctx-cluster"><div class="ctx-wrap" id="contextChipWrap" hidden><button type="button" class="ctx-chip" id="contextChip" aria-expanded="false" aria-controls="contextPopover" aria-haspopup="dialog" title="上下文占用"><svg class="ctx-ring" viewBox="0 0 20 20" aria-hidden="true"><circle class="ctx-ring-track" cx="10" cy="10" r="7"></circle><circle class="ctx-ring-value" id="contextRing" cx="10" cy="10" r="7"></circle></svg><span id="contextChipLabel">—</span></button><div class="ctx-popover" id="contextPopover" hidden role="dialog" aria-label="上下文占用"><div class="ctx-head"><span id="contextPopoverTitle">上下文已用</span><span class="ctx-ratio" id="contextPopoverRatio">等待快照</span></div><div class="ctx-bar" id="contextBar"></div><div id="contextRows"><div class="ctx-empty">任务开始后，规划与反思会推送占用快照。</div></div><div class="ctx-history" id="contextHistory"></div><div class="ctx-foot"><span id="contextPopoverMeta"></span><a id="contextFullLink" href="/static/context_usage.html" target="_blank" rel="noopener">完整面板</a></div></div></div><button class="primary" id="createRunBtn" type="submit">开始执行</button></div></div>
    </form>
  </section>

  <section class="workbench">
    <div class="tabs"><button class="tab active" data-panel="tracePanel">执行轨迹</button><button class="tab" data-panel="artifactsPanel">最终产物</button><button class="tab" data-panel="metricsPanel">运行数据</button></div>
    <div class="panel" id="tracePanel"><div class="timeline-empty" id="timelineEmpty">创建任务后，规划、工具调用、反思与质量评估会实时显示在这里。</div><div id="timeline"></div></div>
    <div class="panel" id="artifactsPanel" hidden><div id="artifacts"><div class="timeline-empty">任务完成后显示分析、选题和文案。</div></div></div>
    <div class="panel" id="metricsPanel" hidden><div class="metrics" id="metrics"></div></div>
  </section>
</main>

<aside class="drawer" id="historyPanel" hidden><div class="drawer-head"><b>历史任务</b><button class="icon-btn" id="closeHistoryBtn">×</button></div><div class="drawer-body" id="historyList"></div></aside>

<dialog id="approvalDialog"><div class="dialog-head">确认外部操作</div><div class="dialog-body"><p id="approvalSummary"></p><div class="code" id="approvalPayload"></div></div><div class="dialog-actions"><button class="secondary" id="rejectApprovalBtn">拒绝</button><button class="approve" id="approveBtn">确认执行</button></div></dialog>
<dialog id="toolDialog"><div class="dialog-head" id="toolDialogTitle">工具详情</div><div class="dialog-body"><div class="code" id="toolDialogPayload"></div></div><div class="dialog-actions"><button class="secondary" onclick="document.getElementById('toolDialog').close()">关闭</button></div></dialog>
<div class="toast" id="toast"></div>

<script>
  const toolOrder=['knowledge_search','crawl_notes','analyze_notes','generate_topics','generate_contents','generate_images','publish_to_xhs','sync_to_feishu'];
  const toolNames={knowledge_search:'检索',crawl_notes:'采集',load_notes:'载入样本',analyze_notes:'分析',generate_topics:'选题',generate_contents:'生成',generate_images:'配图',publish_to_xhs:'发布',sync_to_feishu:'飞书'};
  const eventNames={run_started:'任务开始',plan_created:'计划已生成',step_started:'步骤开始',tool_started:'工具调用开始',tool_completed:'工具调用完成',crawl_progress:'采集进度',reflection:'Agent 反思',replan:'重新规划',quality_evaluation:'质量评估',approval_required:'等待审批',approval_resolved:'审批已处理',step_failed:'步骤失败',run_stopping:'正在停止',run_stopped:'任务已停止',run_completed:'任务完成',run_failed:'任务失败',context_usage:'上下文占用',obs_compress:'观察压缩'};
  const state={run:null,source:null,lastEventId:0,toolEvents:{},startedAt:null,contextUsage:null,contextHistory:[],contextView:null};
  const CONTEXT_CATS=[
    {key:'system',label:'系统提示词',color:'#98a2b3',always:true},
    {key:'tools',label:'工具定义',color:'#7c5cbf',always:true},
    {key:'messages',label:'对话消息',color:'#3b82f6',always:true},
    {key:'skills',label:'技能索引',color:'#12b76a'},
    {key:'knowledge',label:'知识',color:'#f59e0b'},
    {key:'semantic',label:'语义记忆',color:'#14b8a6'},
    {key:'episodic',label:'经历记忆',color:'#fb7185'},
    {key:'other',label:'其他',color:'#667085'}
  ];
  const CONTEXT_RING=2*Math.PI*7;

  const $=id=>document.getElementById(id);
  function toast(message){const node=$('toast');node.textContent=message;node.style.display='block';setTimeout(()=>node.style.display='none',2600)}
  function json(value){return JSON.stringify(value??{},null,2)}
  function isTerminal(status){return ['completed','failed','stopped'].includes(status)}
  function enabledTools(){return [...document.querySelectorAll('.tool[data-tool]:not(.disabled)')].map(node=>node.dataset.tool).concat(['load_notes'])}

  async function api(path,options={}){const response=await fetch(path,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});if(!response.ok){const body=await response.json().catch(()=>({detail:response.statusText}));throw new Error(body.detail||response.statusText)}return response.json()}

  function addMessage(role,text,kind=''){const empty=$('emptyState');if(empty)empty.remove();const speaker=document.createElement('div');speaker.className='speaker';speaker.textContent=role==='user'?'你':'Agent';const bubble=document.createElement('div');bubble.className=`bubble ${role} ${kind}`;bubble.textContent=text;$('messages').append(speaker,bubble);$('messages').scrollTop=$('messages').scrollHeight}

  function setStatus(status){$('runStatus').className=`status ${status}`;$('runStatus').textContent={queued:'排队中',running:'运行中',waiting_for_approval:'等待确认',stopping:'正在停止',stopped:'已停止',completed:'已完成',failed:'失败'}[status]||'就绪';$('stopRunBtn').disabled=!state.run||isTerminal(status)}

  function resetToolStates(){document.querySelectorAll('.tool[data-tool]').forEach(node=>{node.classList.remove('running','completed','failed');if(['publish_to_xhs','sync_to_feishu'].includes(node.dataset.tool))node.classList.add('disabled')});state.toolEvents={};const crawlLabel=$('crawlProgress');if(crawlLabel)crawlLabel.textContent=''}
  function setToolState(name,status,event){const node=document.querySelector(`.tool[data-tool="${name}"]`);if(node){node.classList.remove('running','completed','failed');if(status)node.classList.add(status)}if(event){state.toolEvents[name]=state.toolEvents[name]||[];state.toolEvents[name].push(event)}}

  function eventCard(event){const data=event.data||{};const node=document.createElement('article');const status=event.type.includes('failed')?'error':event.type.includes('started')||event.type==='approval_required'?'running':'done';node.className=`event ${status}`;node.dataset.eventId=event.id;const title=eventNames[event.type]||event.type;const subtitle=data.name?`${toolNames[data.name]||data.name}${data.summary?' · '+data.summary:''}`:(data.reason||data.error||'');node.innerHTML=`<div class="event-head"><i class="event-node"></i><div><div class="event-title"></div><div class="event-sub"></div></div><span class="event-time"></span></div>`;node.querySelector('.event-title').textContent=title;node.querySelector('.event-sub').textContent=subtitle;node.querySelector('.event-time').textContent=new Date(event.timestamp).toLocaleTimeString('zh-CN',{hour12:false});if(Object.keys(data).length){const detail=document.createElement('div');detail.className='event-detail';const code=document.createElement('div');code.className='code';code.textContent=json(data);detail.append(code);node.append(detail)}return node}

  function applyEvent(event,{render=true,live=true}={}){if(event.id<=state.lastEventId)return;state.lastEventId=event.id;const data=event.data||{};if(render){$('timelineEmpty')?.remove();$('timeline').append(eventCard(event));$('tracePanel').scrollTop=$('tracePanel').scrollHeight}
    if(event.type==='run_started')addMessage('agent','任务已开始。我会先生成计划，再按目标自主选择工具。');
    if(event.type==='plan_created')addMessage('agent',`计划已生成：${(data.steps||[]).map(name=>toolNames[name]||name).join(' → ')}`);
    if(event.type==='tool_started'){setToolState(data.name,'running',event)}
    if(event.type==='tool_completed'){setToolState(data.name,'completed',event)}
    if(event.type==='step_failed'){setToolState(data.name,'failed',event)}
    if(event.type==='crawl_progress'){setToolState('crawl_notes','running',event);const label=$('crawlProgress');if(label)label.textContent=`已收集 ${data.collected||0} / ${data.target||'?'}${data.keyword?' · '+data.keyword:''}`;}
    if(event.type==='reflection'){addMessage('agent',data.reason||'已完成一次反思。','decision')}
    if(event.type==='replan'){addMessage('agent',`我决定调整计划：${data.reason||'当前路径不足以完成目标。'}`,'decision')}
    if(event.type==='approval_required'){showApproval(event)}
    if(event.type==='context_usage'){rememberContext(data);state.contextUsage=data;state.contextView=null;renderContextChip()}
    if(live&&['run_completed','run_stopped','run_failed'].includes(event.type)){loadRun(state.run.run_id);loadHistory()}
  }

  function formatTokens(value){const n=Math.max(0,Number(value)||0);if(n>=1000000){const v=n/1000000;return (v>=10?v.toFixed(0):v.toFixed(1).replace(/\.0$/,''))+'M'}if(n>=1000){const v=n/1000;return (v>=100?v.toFixed(0):v.toFixed(1).replace(/\.0$/,''))+'K'}return String(Math.round(n))}
  function rememberContext(snap){if(!snap)return;const id=snap.call_id;const index=state.contextHistory.findIndex(item=>item&&item.call_id===id);if(index>=0)state.contextHistory[index]=snap;else state.contextHistory.push(snap);if(state.contextHistory.length>20)state.contextHistory=state.contextHistory.slice(-20)}
  function contextRoleSnaps(){const byRole=new Map();state.contextHistory.forEach(snap=>{if(snap&&snap.role)byRole.set(snap.role,snap)});const order=['planner','reflector','recover','consolidator'];const chips=[];order.forEach(role=>{if(byRole.has(role))chips.push(byRole.get(role))});byRole.forEach((snap,role)=>{if(!order.includes(role))chips.push(snap)});return chips}
  function formatPercent(value){const n=Math.max(0,Math.min(100,Number(value)||0));if(n>=10)return Math.round(n)+'%';if(n>=0.05)return n.toFixed(1).replace(/\.0$/,'')+'%';return '0%'}
  function closeContextPopover(){const pop=$('contextPopover');const chip=$('contextChip');if(pop)pop.hidden=true;if(chip)chip.setAttribute('aria-expanded','false')}
  function renderContextChip(){const snap=state.contextUsage;const label=$('contextChipLabel');const ring=$('contextRing');const pct=snap?Math.max(0,Math.min(100,Number(snap.percent_window)||0)):0;if(label)label.textContent=snap?formatPercent(pct):'—';if(ring)ring.style.strokeDashoffset=String(CONTEXT_RING*(1-pct/100));renderContextPopover(state.contextView||snap)}
  function renderContextPopover(snap){const title=$('contextPopoverTitle');const ratio=$('contextPopoverRatio');const bar=$('contextBar');const rows=$('contextRows');const meta=$('contextPopoverMeta');if(!title||!ratio||!bar||!rows||!meta)return;if(!snap){title.textContent='上下文已用';ratio.textContent='等待快照';bar.innerHTML='';rows.innerHTML='<div class="ctx-empty">任务开始后，规划与反思会推送占用快照。需要 AGENT_CONTEXT_BUILDER_ENABLED。</div>';meta.textContent='';$('contextHistory')?.replaceChildren();return}const pct=Math.max(0,Math.min(100,Number(snap.percent_window)||0));title.textContent='上下文已用 '+formatPercent(pct);const total=Number(snap.total)||0;const windowTokens=Number(snap.window)||0;ratio.textContent='~'+formatTokens(total)+' / '+(windowTokens?formatTokens(windowTokens):'—');const denom=windowTokens||total||1;const visible=CONTEXT_CATS.filter(cat=>cat.always||(Number(snap[cat.key])||0)>0);bar.innerHTML=visible.map(cat=>{const width=((Number(snap[cat.key])||0)/denom)*100;return `<span style="flex:0 0 ${width}%;background:${cat.color}"></span>`}).join('');rows.replaceChildren(...visible.map(cat=>{const row=document.createElement('div');row.className='ctx-row';const dot=document.createElement('i');dot.style.background=cat.color;const name=document.createElement('span');name.textContent=cat.label;const count=document.createElement('b');count.textContent='~'+formatTokens(snap[cat.key]||0);row.append(dot,name,count);return row}));const budgetPct=Number(snap.percent_budget)||0;meta.textContent=`${snap.role||'—'} · 预算 ${budgetPct.toFixed(0)}%`;renderContextHistory(snap)}
  function renderContextHistory(shown){const root=$('contextHistory');if(!root)return;const snaps=contextRoleSnaps();root.replaceChildren(...snaps.map(snap=>{const button=document.createElement('button');button.type='button';button.className=(shown&&snap.call_id===shown.call_id)?'on':'';button.textContent=`${snap.role} · tools ${snap.tools||0}`;button.addEventListener('click',event=>{event.preventDefault();event.stopPropagation();state.contextView=snap;renderContextPopover(snap)});return button}))}
  function toggleContextPopover(){const pop=$('contextPopover');if(!pop)return;const willOpen=pop.hidden;pop.hidden=!willOpen;$('contextChip').setAttribute('aria-expanded',willOpen?'true':'false')}
  async function loadContextUsage(runId){try{const payload=await api(`/agent/runs/${runId}/context_usage`);if(!state.run||state.run.run_id!==runId)return;if(Array.isArray(payload.history))state.contextHistory=payload.history.slice(-20);if(payload.latest){state.contextUsage=payload.latest;state.contextView=null;renderContextChip()}else renderContextChip()}catch(error){/* 快照缺失时保留 SSE 已显示的占用 */}}

  function connectEvents(runId){if(state.source)state.source.close();state.source=new EventSource(`/agent/runs/${runId}/events`);Object.keys(eventNames).forEach(type=>state.source.addEventListener(type,e=>{const event=JSON.parse(e.data);applyEvent(event)}));state.source.onerror=()=>{if(state.run&&!isTerminal(state.run.status))setTimeout(()=>connectEvents(runId),1200)}}

  function setContextLink(runId){const href=runId?`/static/context_usage.html?run_id=${encodeURIComponent(runId)}`:'/static/context_usage.html';const link=$('contextUsageLink');if(link)link.href=href;const full=$('contextFullLink');if(full)full.href=href;const wrap=$('contextChipWrap');if(wrap)wrap.hidden=!runId}
  async function createRun(event){event.preventDefault();const goal=$('goalInput').value.trim();if(!goal)return;try{$('createRunBtn').disabled=true;resetView();addMessage('user',goal);const run=await api('/agent/runs',{method:'POST',body:json({goal,audience:$('audienceInput').value.trim(),tone:$('toneInput').value.trim(),backend:'openai',enabled_tools:enabledTools()})});state.run=run;state.startedAt=Date.now();localStorage.setItem('xhs-agent-last-run',run.run_id);$('runId').textContent=`/ ${run.run_id}`;setContextLink(run.run_id);$('modelLabel').textContent=run.model||run.backend||'OpenAI';setStatus(run.status);connectEvents(run.run_id);loadContextUsage(run.run_id);loadHistory()}catch(error){toast(error.message)}finally{$('createRunBtn').disabled=false}}

  function resetView(){if(state.source)state.source.close();state.source=null;state.lastEventId=0;resetToolStates();state.contextUsage=null;state.contextHistory=[];state.contextView=null;closeContextPopover();renderContextChip();const wrap=$('contextChipWrap');if(wrap)wrap.hidden=true;$('messages').innerHTML='';$('timeline').innerHTML='';$('timelineEmpty')?.remove();const empty=document.createElement('div');empty.className='timeline-empty';empty.id='timelineEmpty';empty.textContent='等待 Agent 规划任务…';$('tracePanel').prepend(empty);$('artifacts').innerHTML='<div class="timeline-empty">任务完成后显示分析、选题和文案。</div>';renderMetrics({})}

  async function loadRun(runId){try{const run=await api(`/agent/runs/${runId}`);state.run=run;localStorage.setItem('xhs-agent-last-run',runId);$('runId').textContent=`/ ${runId}`;setContextLink(runId);$('modelLabel').textContent=run.model||run.backend||'OpenAI';setStatus(run.status);resetToolStates();state.contextUsage=null;state.contextHistory=[];state.contextView=null;closeContextPopover();renderContextChip();$('messages').innerHTML='';addMessage('user',run.goal);$('timeline').innerHTML='';$('timelineEmpty')?.remove();state.lastEventId=0;run.events.forEach(event=>applyEvent(event,{live:false}));loadContextUsage(runId);renderArtifacts(run.outputs||{});renderMetrics(run);if(!isTerminal(run.status))connectEvents(runId)}catch(error){localStorage.removeItem('xhs-agent-last-run');toast(error.message)}}

  async function stopRun(){if(!state.run)return;try{const run=await api(`/agent/runs/${state.run.run_id}/stop`,{method:'POST'});setStatus(run.status)}catch(error){toast(error.message)}}

  function showApproval(event){const data=event.data||{};$('approvalDialog').dataset.approvalId=data.approval_id;$('approvalSummary').textContent=`Agent 请求执行「${toolNames[data.action]||data.action}」。请核对参数后确认。`;$('approvalPayload').textContent=json(data.params);$('approvalDialog').showModal()}
  async function resolveApproval(approved){const dialog=$('approvalDialog');try{await api(`/agent/runs/${state.run.run_id}/confirm`,{method:'POST',body:json({approval_id:dialog.dataset.approvalId,approved})});dialog.close()}catch(error){toast(error.message)}}

  function renderArtifacts(outputs){const root=$('artifacts');root.innerHTML='';if(outputs.analysis_summary){const card=document.createElement('article');card.className='artifact';card.innerHTML='<h3>分析结论</h3><p></p>';card.querySelector('p').textContent=outputs.analysis_summary;root.append(card)}(outputs.results||[]).forEach((item,index)=>{const card=document.createElement('article');card.className='artifact';card.innerHTML=`<h3></h3><p></p><div class="tags"></div>`;card.querySelector('h3').textContent=`${index+1}. ${item.title||'未命名文案'}`;card.querySelector('p').textContent=item.body||'';(item.hashtags||[]).forEach(tag=>{const span=document.createElement('span');span.className='tag';span.textContent=tag;card.querySelector('.tags').append(span)});root.append(card)});if(!root.children.length)root.innerHTML='<div class="timeline-empty">暂无最终产物。</div>'}
  function renderMetrics(run){const usage=run.usage||{};const eventCount=(run.events||[]).length;const toolCalls=Object.values(run.tool_calls||{}).reduce((sum,value)=>sum+value,0);$('metrics').innerHTML=`<div class="metric"><b>${usage.calls||0}</b><span>模型调用</span></div><div class="metric"><b>${usage.est_tokens||0}</b><span>估算 Tokens</span></div><div class="metric"><b>${toolCalls}</b><span>工具调用</span></div><div class="metric"><b>${eventCount}</b><span>运行事件</span></div><div class="metric"><b>${run.status||'-'}</b><span>任务状态</span></div><div class="metric"><b>${run.backend||'-'}</b><span>模型后端</span></div>`}

  async function loadHistory(){try{const data=await api('/agent/runs?limit=50');const root=$('historyList');root.innerHTML='';data.items.forEach(item=>{const button=document.createElement('button');button.className='history-item';button.innerHTML='<div class="history-goal"></div><div class="history-meta"><span></span><span></span></div>';button.querySelector('.history-goal').textContent=item.goal;button.querySelectorAll('.history-meta span')[0].textContent=item.status;button.querySelectorAll('.history-meta span')[1].textContent=new Date(item.created_at).toLocaleString('zh-CN',{hour12:false});button.onclick=()=>{loadRun(item.run_id);$('historyPanel').hidden=true};root.append(button)});if(!data.items.length)root.innerHTML='<div class="timeline-empty">暂无历史任务</div>'}catch(error){toast(error.message)}}

  document.querySelectorAll('.suggestion').forEach(button=>button.onclick=()=>{$('goalInput').value=button.textContent;$('goalInput').focus()});
  document.querySelectorAll('.tab').forEach(button=>button.onclick=()=>{document.querySelectorAll('.tab').forEach(item=>item.classList.toggle('active',item===button));document.querySelectorAll('.panel').forEach(panel=>panel.hidden=panel.id!==button.dataset.panel)});
  document.querySelectorAll('.tool[data-tool]').forEach(button=>button.onclick=()=>{const name=button.dataset.tool;if(['publish_to_xhs','sync_to_feishu'].includes(name)&&!state.run){button.classList.toggle('disabled');return}const events=state.toolEvents[name]||[];$('toolDialogTitle').textContent=`${toolNames[name]}工具详情`;$('toolDialogPayload').textContent=events.length?json(events):'本次任务尚未调用该工具。';$('toolDialog').showModal()});
  $('runForm').addEventListener('submit',createRun);$('stopRunBtn').onclick=stopRun;$('historyBtn').onclick=()=>{$('historyPanel').hidden=!$('historyPanel').hidden;loadHistory()};$('closeHistoryBtn').onclick=()=>{$('historyPanel').hidden=true};$('approveBtn').onclick=()=>resolveApproval(true);$('rejectApprovalBtn').onclick=()=>resolveApproval(false);
  $('contextChip')?.addEventListener('click',event=>{event.preventDefault();event.stopPropagation();toggleContextPopover()});
  document.addEventListener('click',event=>{const wrap=$('contextChipWrap');if(!wrap||wrap.hidden||$('contextPopover').hidden)return;if(wrap.contains(event.target))return;closeContextPopover()});
  document.addEventListener('keydown',event=>{if(event.key==='Escape')closeContextPopover()});
  renderMetrics({});loadHistory();const bootRun=new URLSearchParams(location.search).get('run_id')||localStorage.getItem('xhs-agent-last-run');if(bootRun)loadRun(bootRun);
</script>
</body>
</html>
