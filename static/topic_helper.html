<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>选题工具调用演示</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      line-height: 1.5;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 28px 16px 48px; }
    h1 { margin: 0 0 6px; font-size: 26px; color: #ff2442; }
    .sub { margin: 0 0 20px; color: #86868b; font-size: 14px; }
    form, .panel {
      background: #fff;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
    }
    label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 6px; }
    label:first-child { margin-top: 0; }
    input, select, textarea {
      width: 100%;
      border: 1px solid #e0e0e5;
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
      background: #fff;
    }
    textarea { min-height: 76px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 140px 120px; gap: 12px; }
    button {
      margin-top: 16px;
      border: 0;
      border-radius: 10px;
      background: #ff2442;
      color: #fff;
      font: inherit;
      font-weight: 700;
      padding: 10px 22px;
      cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: wait; }
    #result { margin-top: 16px; }
    .status {
      display: inline-block;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 13px;
      font-weight: 700;
    }
    .status.ok { background: #e9f9ee; color: #1a7f3c; }
    .status.refuse { background: #fdecea; color: #c62828; }
    .status.clarify { background: #fff6e5; color: #9a6700; }
    .status.degraded { background: #f0f0f3; color: #555; }
    .message { margin: 10px 0 0; }
    .questions { margin: 8px 0 0; padding-left: 18px; }
    .cards { display: grid; gap: 12px; margin-top: 14px; }
    .card { background: #fff; border-radius: 14px; padding: 14px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .angle { font-size: 13px; color: #ff2442; font-weight: 700; }
    .title { font-size: 16px; font-weight: 700; margin: 4px 0; }
    .why, .meta { font-size: 13px; color: #555; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .tag { background: #f5f5f7; border-radius: 999px; padding: 2px 8px; font-size: 12px; color: #555; }
    h2 { font-size: 15px; margin: 18px 0 8px; }
    .step {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      gap: 8px;
      align-items: start;
      padding: 8px 0;
      border-top: 1px solid #eee;
      font-size: 13px;
    }
    .ok { color: #1a7f3c; font-weight: 700; }
    .bad { color: #c62828; font-weight: 700; }
    .digest { grid-column: 2 / -1; color: #666; word-break: break-word; }
    .empty { color: #86868b; font-size: 14px; }
    details { margin-top: 14px; font-size: 13px; }
    pre { white-space: pre-wrap; word-break: break-word; background: #f5f5f7; border-radius: 10px; padding: 10px; }
    @media (max-width: 640px) {
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>选题工具调用演示</h1>
    <p class="sub">输入主题，查看角度和工具轨迹。默认 mock，只走白名单选题工具。</p>
    <form id="form">
      <label for="theme">主题</label>
      <textarea id="theme" name="theme" placeholder="例如：大学生平价通勤穿搭"></textarea>
      <div class="row">
        <div>
          <label for="audience">受众（可选）</label>
          <input id="audience" name="audience" placeholder="留空则用默认受众" />
        </div>
        <div>
          <label for="count">角度数</label>
          <input id="count" name="count" type="number" min="3" max="5" value="4" />
        </div>
        <div>
          <label for="mode">模式</label>
          <select id="mode" name="mode">
            <option value="mock" selected>mock</option>
            <option value="live">live</option>
          </select>
        </div>
      </div>
      <button id="go" type="submit">生成</button>
    </form>
    <div id="result" aria-live="polite"></div>
  </div>
  <script>
    const form = document.getElementById("form");
    const result = document.getElementById("result");
    const button = document.getElementById("go");
    const STATUS = { ok: "已生成", refuse: "已拒绝", clarify: "需要补充", degraded: "降级" };

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    function digestText(digest) {
      if (!digest || typeof digest !== "object") return "";
      return Object.entries(digest).map(([key, value]) => {
        const shown = Array.isArray(value) ? value.slice(0, 4).join("、") : String(value);
        return key + "=" + shown;
      }).join(" · ");
    }

    function render(data) {
      result.replaceChildren();
      const panel = el("div", "panel");
      const status = String(data.status || "");
      const badge = el("span", "status " + status, STATUS[status] || status || "未知");
      panel.append(badge);
      if (data.reason) panel.append(el("p", "meta", "原因：" + data.reason));
      if (data.message) panel.append(el("p", "message", data.message));
      if (Array.isArray(data.questions) && data.questions.length) {
        const list = el("ul", "questions");
        data.questions.forEach((q) => list.append(el("li", "", q)));
        panel.append(list);
      }
      result.append(panel);

      const angles = Array.isArray(data.angles) ? data.angles : [];
      result.append(el("h2", "", "角度"));
      if (!angles.length) {
        result.append(el("p", "empty", "没有生成角度。"));
      } else {
        const cards = el("div", "cards");
        angles.forEach((angle) => {
          const card = el("article", "card");
          card.append(el("div", "angle", angle.angle || ""));
          card.append(el("div", "title", angle.title || ""));
          card.append(el("div", "why", angle.why || ""));
          card.append(el("div", "meta", "受众：" + (angle.audience || "")));
          const tags = el("div", "tags");
          (angle.grounded_from || []).forEach((id) => tags.append(el("span", "tag", id)));
          card.append(tags);
          cards.append(card);
        });
        result.append(cards);
      }

      const steps = (data.trace && data.trace.steps) || [];
      result.append(el("h2", "", "工具轨迹"));
      const trace = el("div", "panel");
      if (!steps.length) {
        trace.append(el("p", "empty", "没有调用工具。"));
      } else {
        steps.forEach((step) => {
          const row = el("div", "step");
          row.append(el("span", "", String(step.i ?? "")));
          row.append(el("strong", "", step.tool || ""));
          row.append(el("span", step.ok ? "ok" : "bad", step.ok ? "ok" : "失败"));
          const digest = el("div", "digest", digestText(step.result_digest));
          row.append(digest);
          trace.append(row);
        });
      }
      result.append(trace);

      const raw = el("details");
      raw.append(el("summary", "", "原始 JSON"));
      raw.append(el("pre", "", JSON.stringify(data, null, 2)));
      result.append(raw);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      result.replaceChildren(el("p", "empty", "生成中…"));
      const audience = document.getElementById("audience").value.trim();
      const payload = {
        theme: document.getElementById("theme").value,
        count: Number(document.getElementById("count").value || 4),
        mode: document.getElementById("mode").value || "mock",
      };
      if (audience) payload.audience = audience;
      try {
        const response = await fetch("/topics/helper", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await response.json();
        if (!response.ok) {
          render({ status: "degraded", message: "请求失败", angles: [], trace: { steps: [] }, detail: data });
          return;
        }
        render(data);
      } catch (err) {
        render({ status: "degraded", message: "页面请求失败：" + err, angles: [], trace: { steps: [] } });
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
