<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Context usage · XHS Content Agent</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, "Segoe UI", "PingFang SC", sans-serif;
      background: #14161a;
      color: #e8eaed;
    }
    main { max-width: 760px; margin: 0 auto; padding: 28px 20px 48px; }
    h1 { font-size: 18px; font-weight: 650; margin: 0 0 6px; }
    p.lead { margin: 0 0 18px; color: #9aa0a6; font-size: 13px; line-height: 1.5; }
    form { display: flex; gap: 8px; margin-bottom: 18px; }
    input {
      flex: 1;
      background: #1c1f24;
      color: #e8eaed;
      border: 1px solid #30343b;
      border-radius: 6px;
      padding: 8px 10px;
      font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    button {
      background: #e8eaed;
      color: #14161a;
      border: 0;
      border-radius: 6px;
      padding: 8px 12px;
      font-weight: 650;
      cursor: pointer;
    }
    .card {
      background: #1c1f24;
      border: 1px solid #2c3138;
      border-radius: 10px;
      padding: 16px 16px 12px;
    }
    .window-head, .row {
      display: grid;
      grid-template-columns: 168px 1fr auto;
      gap: 10px;
      align-items: center;
    }
    .window-head { margin-bottom: 8px; font-size: 13px; }
    .nums { font-variant-numeric: tabular-nums; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: #c4c7cc; }
    .track { height: 8px; background: #2a2e35; border-radius: 99px; overflow: hidden; }
    .track > span { display: block; height: 100%; background: #8ab4f8; width: 0; }
    .row { margin: 8px 0; font-size: 13px; }
    .row .track { height: 6px; }
    .row .track > span { background: #9aa0a6; }
    .label small { display: block; color: #9aa0a6; font-size: 11px; }
    .meta { margin-top: 12px; color: #9aa0a6; font-size: 12px; line-height: 1.6; }
    .tags span {
      display: inline-block;
      margin: 2px 4px 0 0;
      padding: 1px 6px;
      border-radius: 99px;
      background: #2a2e35;
      color: #e8eaed;
    }
    .compress {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #2c3138;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 12px;
      color: #81c995;
    }
    .history { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .history button {
      background: #2a2e35;
      color: #e8eaed;
      font-weight: 500;
      font-size: 11px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
    }
    .history button.on { outline: 1px solid #8ab4f8; }
    .empty { color: #9aa0a6; font-size: 13px; }
    a { color: #8ab4f8; }
  </style>
</head>
<body>
<main>
  <h1>Context window</h1>
  <p class="lead">Live token mix for one agent run. Numbers come from <code>context_usage</code> events — this page does not re-tokenize the prompt. Open with <code>?run_id=</code> or paste an id.</p>
  <form id="form">
    <input id="runId" name="run_id" placeholder="run id" autocomplete="off">
    <button type="submit">Connect</button>
  </form>
  <section class="card" id="panel">
    <div class="empty" id="empty">Waiting for a run id.</div>
    <div id="body" hidden>
      <div class="window-head">
        <div>Context window</div>
        <div class="track"><span id="windowBar"></span></div>
        <div class="nums" id="windowNums">0%</div>
      </div>
      <div id="rows"></div>
      <div class="compress" id="compress" hidden></div>
      <div class="meta" id="meta"></div>
      <div class="history" id="history"></div>
    </div>
  </section>
  <p class="lead" style="margin-top:14px">API: <code>GET /agent/runs/{id}/context_usage</code> · stream: <code>GET /agent/runs/{id}/events</code></p>
</main>
<script>
const ROWS = [
  ["system", "System prompts", "系统提示"],
  ["tools", "Tool definitions", "工具定义"],
  ["messages", "Messages", "目标 / 计划 / 观察"],
  ["skills", "Skills index", "技能索引"],
  ["knowledge", "Knowledge (K)", "知识"],
  ["semantic_episodic", "Semantic/Episodic", "画像 / 经历"],
  ["other", "Other", "其他"],
];

const params = new URLSearchParams(location.search);
const runInput = document.getElementById("runId");
runInput.value = params.get("run_id") || "";
let source = null;
let latestCompress = null;
let historySnaps = [];

function pct(part, whole) {
  if (!whole) return 0;
  return Math.max(0, Math.min(100, (part / whole) * 100));
}

function renderHistory() {
  const root = document.getElementById("history");
  root.innerHTML = historySnaps.map((snap, index) => {
    const label = `${snap.role || "?"} #${snap.call_id || index} · ${snap.total || 0}`;
    return `<button type="button" data-index="${index}">${label}</button>`;
  }).join("");
  root.querySelectorAll("button").forEach((button) => {
    button.addEventListener("click", () => render(historySnaps[Number(button.dataset.index)], false));
  });
}

function render(snapshot, push = true) {
  document.getElementById("empty").hidden = true;
  document.getElementById("body").hidden = false;
  if (push) {
    historySnaps.push(snapshot);
    if (historySnaps.length > 20) historySnaps = historySnaps.slice(-20);
  }
  renderHistory();
  document.querySelectorAll("#history button").forEach((button) => {
    const snap = historySnaps[Number(button.dataset.index)];
    button.classList.toggle("on", snap && snap.call_id === snapshot.call_id);
  });
  const total = snapshot.total || 0;
  const windowPct = snapshot.percent_window || 0;
  document.getElementById("windowBar").style.width = Math.min(100, windowPct) + "%";
  document.getElementById("windowNums").textContent =
    windowPct.toFixed(1) + "%  ·  " + total.toLocaleString() + " / " + (snapshot.window || 0).toLocaleString() + " tokens";
  const semantic = (snapshot.semantic || 0) + (snapshot.episodic || 0);
  const values = {
    system: snapshot.system || 0,
    tools: snapshot.tools || 0,
    messages: snapshot.messages || 0,
    skills: snapshot.skills || 0,
    knowledge: snapshot.knowledge || 0,
    semantic_episodic: semantic,
    other: snapshot.other || 0,
  };
  document.getElementById("rows").innerHTML = ROWS.map(([key, label, zh]) => {
    const value = values[key] || 0;
    const share = pct(value, total);
    return `<div class="row"><div class="label">${label}<small>${zh}</small></div><div class="track"><span style="width:${share}%"></span></div><div class="nums">${share.toFixed(0)}%  ${value.toLocaleString()}</div></div>`;
  }).join("");
  const dropped = (snapshot.dropped || []).map(item => `<span>drop:${item}</span>`).join("");
  const concised = (snapshot.concised || []).map(item => `<span>concise:${item}</span>`).join("");
  document.getElementById("meta").innerHTML =
    `Role: ${snapshot.role || "-"} · call #${snapshot.call_id || "-"} · budget ${(snapshot.budget || 0).toLocaleString()} (soft) · ${snapshot.percent_budget ? snapshot.percent_budget.toFixed(1) : "0"}% of budget` +
    `<div class="tags">${dropped}${concised}</div>`;
  const compress = document.getElementById("compress");
  const before = snapshot.before_total;
  const after = snapshot.after_total != null ? snapshot.after_total : (snapshot.compressed ? snapshot.total : null);
  if (snapshot.compressed && before != null && after != null) {
    const delta = before ? Math.round((1 - after / before) * 100) : 0;
    compress.hidden = false;
    compress.textContent = `Compressed observations  ${before.toLocaleString()} → ${after.toLocaleString()}  (${delta >= 0 ? "-" : "+"}${Math.abs(delta)}%)`;
  } else if (latestCompress) {
    compress.hidden = false;
    compress.textContent = `Compressed observations  ${latestCompress.before_tokens.toLocaleString()} → ${latestCompress.after_tokens.toLocaleString()}`;
  } else {
    compress.hidden = true;
  }
}

async function loadSnapshot(runId) {
  const response = await fetch(`/agent/runs/${encodeURIComponent(runId)}/context_usage`);
  if (!response.ok) {
    document.getElementById("empty").hidden = false;
    document.getElementById("empty").textContent = "Run not found.";
    document.getElementById("body").hidden = true;
    return;
  }
  const payload = await response.json();
  historySnaps = (payload.history || []).slice();
  if (payload.latest) render(payload.latest, false);
  else {
    document.getElementById("empty").hidden = false;
    document.getElementById("empty").textContent = "Connected. No context snapshot yet.";
    document.getElementById("body").hidden = true;
  }
}

function connect(runId) {
  if (source) source.close();
  latestCompress = null;
  const url = new URL(location.href);
  url.searchParams.set("run_id", runId);
  history.replaceState(null, "", url);
  loadSnapshot(runId);
  source = new EventSource(`/agent/runs/${encodeURIComponent(runId)}/events`);
  source.addEventListener("context_usage", (event) => {
    const payload = JSON.parse(event.data);
    render(payload.data || payload);
  });
  source.addEventListener("obs_compress", (event) => {
    const payload = JSON.parse(event.data);
    latestCompress = payload.data || payload;
  });
}

document.getElementById("form").addEventListener("submit", (event) => {
  event.preventDefault();
  const runId = runInput.value.trim();
  if (runId) connect(runId);
});
if (runInput.value.trim()) connect(runInput.value.trim());
</script>
</body>
</html>
